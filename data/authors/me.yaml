bio: |
  Huijie Yang is a Ph.D. Candidate in Integrated Biomedical Sciences at UT Health Science Center San Antonio, working in Dr. Yu Luan's lab. Her research focuses on computational biology, multi-omics data integration, and single-cell transcriptomics to understand cancer genomics, 3D chromatin organization, and disease mechanisms in hepatocellular carcinoma, aging, and pancreatitis.

