experience:
  - role: Project Leader
    org: UT Health Science Center San Antonio — Dr. Yu Luan Lab
    start: 2025-11-01
    summary: |
      Integrative multi-omics analysis of epigenetic and 3D genome regulation in
      MET- and MYC-driven hepatocellular carcinoma. Mapped the regulatory
      architecture of the tumor microenvironment by integrating Hi-C, RNA-seq, and
      ATAC-seq data; constructed TF regulatory networks using PECA.
  - role: Project Leader
    org: UT Health Science Center San Antonio — Dr. Yu Luan & Dr. Ellen Kraig
    start: 2025-05-01
    summary: |
      Characterizing rapamycin-responsive myeloid population in aging. Performed
      scRNA-seq analysis on CD11b+ PBMC cells and WGCNA on CD14+ monocytes,
      supporting NIH R21 grant submission.
  - role: Major Researcher
    org: UT Health Science Center San Antonio — Dr. Yu Luan & Dr. Pei Wang
    start: 2025-02-01
    summary: |
      Identification and functional characterization of pancreatitis risk variants.
      Integrated GWAS SNPs with ATAC-seq, ChIP-seq, and Hi-C data to prioritize
      functional SNPs and reveal 3D chromatin mechanisms in pancreatitis.
  - role: Project Leader
    org: UT Health Science Center San Antonio — Dr. Yu Luan & Dr. Luzhe Sun
    start: 2024-10-01
    summary: |
      Single-cell RNA sequencing reveals tumor progression and microenvironment
      features in immune-hot and immune-cold hepatocellular carcinoma (manuscript
      under preparation). Identified SOX4 and HK2 as potential markers linking
      oncogenic signaling to immune evasion.
  - role: Major Researcher
    org: UT Health Science Center San Antonio — Dr. Guangming Zhong
    start: 2023-09-01
    end: 2024-08-31
    summary: |
      Biological mechanisms of Chlamydia-gut interactions. Characterized intestinal
      immune cell populations using immunofluorescence and flow cytometry in
      knockout mouse models.
  - role: Major Researcher
    org: Central South University — Dr. Yang Xiao
    start: 2021-05-01
    end: 2023-05-31
    summary: |
      Mechanism of immune cells involved in diabetic cardiomyopathy. Conducted
      snRNA-seq analysis and experimental validation, revealing macrophage-fibroblast
      communication in myocardial fibrosis; targeting PDGFC as a therapeutic approach.
  - role: Project Leader
    org: Central South University — Dr. Zhuowei Hu
    start: 2020-10-01
    end: 2021-06-30
    summary: |
      Intestinal microbiota and pathogenesis of hypertension. Explored combined
      therapeutic effects of berberine and stachyose in hypertension models.
